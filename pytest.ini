[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q -p no:langsmith_plugin

# Why the plugin is disabled
# --------------------------
# This machine has a broken pydantic install (1.6.2 paired with a
# pydantic_core 2.x). NETRA uses no pydantic anywhere - dataclasses and a
# hand-rolled validator throughout - but pytest auto-loads every installed
# plugin, and langsmith's plugin imports pydantic at collection time. Without
# this line every test run dies with:
#
#     ImportError: cannot import name 'ConfigDict' from 'pydantic'
#
# before a single test is collected. Disabling that one plugin is narrower than
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 and leaves the rest of pytest alone.
#
# If someone repairs pydantic in the environment, this line can go. Do not
# "fix" it by adding pydantic to requirements.txt: the edge pipeline must keep
# running on numpy and PyYAML alone.
